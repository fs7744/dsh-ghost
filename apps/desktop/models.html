<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-ghost · 模型库</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* 独立页专用样式，不改全局 style.css。 */
      #models-root { max-width: 960px; margin: 24px auto; padding: 0 20px; }
      #models-root .mmbar { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #444; padding-bottom: 10px; }
      #models-root .mspacer { flex: 1; }
      #models-root .mdemo { color: #c9a227; font-size: 12px; }
      #models-root .mnotice { min-height: 20px; color: #8ab4f8; font-size: 13px; margin: 8px 0; }
      #models-root .msection { margin: 18px 0; }
      #models-root .mprovider { border: 1px solid #444; border-radius: 6px; padding: 10px 12px; margin: 10px 0; }
      #models-root .mphead { display: flex; align-items: center; gap: 10px; }
      #models-root .mmeta { color: #888; font-size: 12px; }
      #models-root .mprobe { font-size: 12px; margin-left: 8px; }
      #models-root .mprobe.ok { color: #6cc26c; }
      #models-root .mprobe.bad { color: #e06c6c; }
      #models-root .mmodels { list-style: none; padding-left: 8px; }
      #models-root .mmodel { display: flex; gap: 12px; padding: 4px 0; }
      #models-root .mid { color: #888; font-size: 12px; }
      #models-root .mcap { color: #aaa; font-size: 12px; }
      #models-root .mrole { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
      #models-root .mrole span { width: 70px; }
      #models-root .mrole em { color: #888; font-size: 12px; font-style: normal; }
      #models-root .mbtns { display: flex; gap: 8px; }
      #models-root .empty { color: #888; }
    </style>
  </head>
  <body>
    <div id="models-root"></div>
    <script type="module" src="/src/models-app.ts"></script>
  </body>
</html>
