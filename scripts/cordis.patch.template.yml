# dsh-ghost 的宿主插件层 —— 单一真相源。
# scripts/lib-driver.mjs 每次启动宿主前把它落盘到 profile 的 cordis.patch.yml；
# 不要直接改 .dsh-home 里的副本（会被覆盖）。占位符由 renderPatch() 替换。
- insert:
    - id: ghost-memory
      name: '@dsh-ghost/memory-plugin'
      config:
        root: '{{REPO}}/.ghost/memory'
        # /init 草案只允许扫描仓库内；桌面端以后改成用户工作目录。
        repoRoot: '{{REPO}}'

    # 用户扩展：放 JSON 就能加页面/注入界面/登记 LLM 服务（见 docs/UI-EXTENSIONS.md）。
    - id: ghost-ui
      name: '@dsh-ghost/ui-plugin'
      config:
        root: '{{REPO}}/.ghost/ui'

    # 自动化：浏览器（CDP 直连已装浏览器）与 Windows 电脑操控。
    # 默认关闭——要在「宿主能力」页显式开启，插件内也会再查一次开关。
    - id: ghost-automation
      name: '@dsh-ghost/automation-plugin'
      config:
        stateDir: '{{REPO}}/.ghost'
        workspaceDir: '{{REPO}}'

    - id: ghost-orchestrator
      name: '@dsh-ghost/orchestrator-plugin'
      config:
        stateFile: '{{REPO}}/.ghost/tickets.json'
        source: 'local'
        # 信息源可插拔：内置 GitHub / 声明式映射 / 用户自定义 mapper。
        # 密钥一律走 *Env 指向环境变量，不写进配置。详见 docs/SOURCES.md。
        sources:
          - id: github
            kind: github
            description: 'GitHub webhook（内置适配器）'
            auth:
              type: hmac
              header: x-hub-signature-256
              prefix: 'sha256='
              secretEnv: GH_WEBHOOK_SECRET
            options:
              botLogin: dsh-ghost
              mentionAliases: [ghost]

          - id: forum
            kind: generic
            description: '任意 JSON webhook（声明式映射）'
            auth:
              type: token
              header: x-forum-token
              valueEnv: HUB_FORUM_TOKEN
            mapping:
              eventHeader: x-source-event
              events: [message.created]
              where:
                - path: payload.kind
                  equals: question
              fields:
                threadId: '{{payload.conversation}}#{{payload.id}}'
                text: '{{payload.body}}'
                actor: '{{payload.sender}}'
                human: '{{payload.isHuman}}'
                addressed:
                  contains: ['@ghost']
                channel:
                  thread: '{{payload.conversation}}'
                  address:
                    number: '{{payload.id}}'

          - id: mine
            kind: custom
            description: '用户自定义 .mjs mapper'
            options:
              mention: '@ghost'
            mapper: '{{REPO}}/packages/source-hub/examples/im.mjs'

- id: llm-pi-ai
  config:
    providers:
      wb:
        displayName: WorkBuddy Gateway
        api: openai-completions
        baseURL: '{{BASE_URL}}'
        apiKeyEnv: WB_KEY
        models:
          - id: '{{MODEL}}'
            name: '{{MODEL}}'
            contextWindow: 192000
            maxTokens: 8192
{{PROVIDERS}}

# 用户在界面里开启的宿主插件（电脑操控 / 定时任务 / 持久目标…）。
# 只允许白名单里的包，且包必须在运行时里存在；渲染时决定插不插。
{{HOST_PLUGINS}}

# 出站代理：宿主按 HTTP_PROXY / HTTPS_PROXY / NO_PROXY 解析，装到 undici 全局 dispatcher。
# 本地回环（localhost/127.0.0.1/::1）始终直连，避免代理把宿主自己的流量绕回去。
- id: http-proxy
  name: '@deepseek-ai/dsh-http-proxy'

# 新会话自动选中可用模型，避免默认模型不可用导致 session/model-unavailable。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: wb
    model: '{{MODEL}}'
