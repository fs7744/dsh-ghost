<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1d1d1a"/>
      <stop offset="1" stop-color="#111110"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#eceae4" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5dcaa5" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#5dcaa5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5dcaa5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
  </defs>

  <!-- 石墨黑圆角瓦片 -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="32" y="32" width="960" height="960" fill="url(#grid)"/>
  </g>
  <rect x="33" y="33" width="958" height="958" rx="215" fill="none" stroke="#45443f" stroke-width="3"/>

  <!-- 幽灵本体：大体量，保证 16px 仍可辨认 -->
  <path d="M300 812V420C300 300 384 220 512 220C640 220 724 300 724 420V812L654 760L584 812L512 760L440 812L370 760Z"
        fill="#eceae4"/>

  <!-- 眼睛：左眼是青色植入环，右眼纯黑 -->
  <circle cx="440" cy="464" r="46" fill="#141412" stroke="#5dcaa5" stroke-width="9"/>
  <circle cx="584" cy="464" r="46" fill="#141412"/>

  <!-- 赛博信号线：从左眼向下，带两个节点 -->
  <path d="M440 510V616H512V712" fill="none" stroke="#5dcaa5" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="431" y="607" width="18" height="18" rx="4" fill="#5dcaa5"/>
  <rect x="503" y="703" width="18" height="18" rx="4" fill="#5dcaa5"/>
</svg>
