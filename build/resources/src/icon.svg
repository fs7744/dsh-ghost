<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1d1d1a"/>
      <stop offset="1" stop-color="#111110"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#eceae4" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="tileClip">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
  </defs>

  <!-- 石墨黑圆角瓦片 -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="32" y="32" width="960" height="960" fill="url(#grid)"/>
  </g>
  <rect x="33" y="33" width="958" height="958" rx="215" fill="none" stroke="#45443f" stroke-width="3"/>

  <!-- 熊猫耳朵：白色耳廓凸起 + 黑色内耳半圆（不做整圈白边） -->
  <circle cx="350" cy="260" r="72" fill="#eceae4"/>
  <circle cx="674" cy="260" r="72" fill="#eceae4"/>

  <!-- 幽灵本体：圆头 + 三个 V 形缺口 -->
  <path d="M360 812V400C360 292 430 210 512 210C594 210 664 292 664 400V812L624 770L570 812L512 770L454 812L400 770Z"
        fill="#eceae4"/>
  <path d="M288 292A62 62 0 0 1 412 292Z" fill="#141412"/>
  <path d="M612 292A62 62 0 0 1 736 292Z" fill="#141412"/>


  <!-- 熊猫眼斑：左眼是青色植入环，右眼纯黑 -->
  <ellipse cx="440" cy="455" rx="58" ry="48" transform="rotate(-12 440 455)"
           fill="#141412" stroke="#5dcaa5" stroke-width="7"/>
  <ellipse cx="584" cy="455" rx="58" ry="48" transform="rotate(12 584 455)" fill="#141412"/>
  <circle cx="440" cy="455" r="14" fill="#eceae4"/>
  <circle cx="584" cy="455" r="14" fill="#eceae4"/>

  <!-- 熊猫鼻 -->
  <ellipse cx="512" cy="538" rx="14" ry="10" fill="#141412"/>

  <!-- 赛博信号线：从左眼斑向下，带一个节点 -->
  <path d="M440 505V610H512V690" fill="none" stroke="#5dcaa5" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="503" y="681" width="18" height="18" rx="4" fill="#5dcaa5"/>

  <!-- 数据尾迹 -->
  <g fill="#5dcaa5">
    <rect x="410" y="842" width="112" height="14" rx="7" opacity="0.9"/>
    <rect x="448" y="872" width="76" height="14" rx="7" opacity="0.55"/>
    <rect x="484" y="902" width="44" height="14" rx="7" opacity="0.28"/>
  </g>
</svg>
